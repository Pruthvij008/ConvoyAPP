# nginx in front of the Convoy API.
#
# Two jobs: terminate TLS, and carry WebSockets through to Node. The second
# one is where this usually goes wrong, and it fails in a way that looks
# like an app bug rather than a proxy bug — REST works perfectly, the map
# loads, and then no position ever arrives because the Socket.IO upgrade
# was quietly dropped.
#
# Install:
#   sudo cp nginx-convoy.conf /etc/nginx/sites-available/convoy
#   sudo ln -s /etc/nginx/sites-available/convoy /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then let certbot rewrite this file for TLS:
#   sudo certbot --nginx -d api.yourdomain.com

# Socket.IO upgrades an ordinary HTTP request to a WebSocket. Without this
# map, `Connection` is a hop-by-hop header that nginx strips, the upgrade
# never reaches Node, and socket.io silently falls back to long-polling —
# or fails outright.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;   # ← change this

    # A voice note or a stop photo goes STRAIGHT to Cloudinary, never
    # through here, so this only has to be big enough for JSON. Small on
    # purpose: it is also the cheapest possible cap on a junk upload.
    client_max_body_size 2m;

    # Real client addresses, because the rate limiter buckets on IP. The app
    # already sets `trust proxy` to 1 — exactly one hop, this one — so a
    # client cannot forge X-Forwarded-For and pick its own bucket.
    location / {
        proxy_pass http://127.0.0.1:3000;

        # HTTP/1.1 is REQUIRED for upgrades. nginx proxies as 1.0 by
        # default, which cannot carry a WebSocket at all.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A live socket is idle between pings. nginx's 60-second default
        # would cut the connection mid-trip, and the phone would reconnect
        # every minute for the whole journey — burning battery and dropping
        # positions in the gaps.
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;

        # Position updates are small and want to leave immediately.
        proxy_buffering off;
    }

    # Health check, kept out of the access log so it does not drown it.
    location = /api/v1/health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        access_log off;
    }
}
